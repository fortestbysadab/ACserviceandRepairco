# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: New + → Blueprint → pick this repo. No build step is needed,
# index.html at the repo root is already fully self-contained.
services:
  - type: web
    name: sheetal-ac-service
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: redirect
        source: /src/*
        destination: /
      - type: redirect
        source: /build.py
        destination: /
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
